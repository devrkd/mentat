name: test-slack-bridge

on:
  push:
    branches: [main]
    paths:
      - "packages/slack-bridge/**"
  pull_request:
    paths:
      - "packages/slack-bridge/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: npm ci
        working-directory: packages/slack-bridge
      - name: Build
        run: npm run build
        working-directory: packages/slack-bridge
      - name: Fail if the committed dist is stale
        run: git diff --exit-code -- packages/slack-bridge/dist
      - name: Test
        run: npm test
        working-directory: packages/slack-bridge
